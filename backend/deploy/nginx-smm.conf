# AutoSMM — smm.shanghai-edu.uz
#
# Dashboard: pm2 on 127.0.0.1:3040, behind basic auth — it injects the admin
# API key into every request it proxies, so whoever reaches it is the admin.
# API: docker on 127.0.0.1:8040. Only what outsiders must reach skips the
# password: Meta/Telegram webhooks (they authenticate themselves), and /media,
# because Instagram fetches the images it publishes from a public URL.
#
# HTTPS is added by:  certbot --nginx -d smm.shanghai-edu.uz

server {
    server_name smm.shanghai-edu.uz;
    client_max_body_size 50m;

    location /instagram/webhook {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /telegram/chat/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8040;
    }

    location / {
        auth_basic "AutoSMM";
        auth_basic_user_file /etc/nginx/.htpasswd-smm;

        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Plan generation can take a while before the API answers.
        proxy_read_timeout 300s;
    }
}
